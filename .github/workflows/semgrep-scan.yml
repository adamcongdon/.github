name: Semgrep SAST Scan

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label (e.g. ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: 'ubuntu-latest'

jobs:
  semgrep:
    name: SAST Scan
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Run Semgrep via Docker
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" returntocorp/semgrep:latest \
            semgrep --config auto --quiet /src
      - name: Run Semgrep Supply Chain rules
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" returntocorp/semgrep:latest \
            semgrep --config "p/supply-chain" --quiet /src
        continue-on-error: true
