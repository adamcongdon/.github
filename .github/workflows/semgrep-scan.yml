name: Semgrep SAST Scan

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label (e.g. ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: 'self-hosted'

jobs:
  semgrep:
    name: SAST Scan
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Semgrep
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip >/dev/null 2>&1 || true
          sudo pip install semgrep --break-system-packages 2>/dev/null || sudo pip install semgrep
      - name: Run Semgrep (auto-detect language)
        run: semgrep --config auto --quiet
      - name: Run Semgrep Supply Chain rules
        run: semgrep --config "p/supply-chain" --quiet
        continue-on-error: true
