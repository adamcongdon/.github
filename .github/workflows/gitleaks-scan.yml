name: Gitleaks Secret Scan

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label (e.g. ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: 'ubuntu-latest'
      scan-mode:
        description: >-
          auto: pull_request and push events scan only the commits they add
          (shallow checkout); every other event (schedule, workflow_dispatch,
          workflow_run, ...) scans full history. full: always scan full history.
        required: false
        type: string
        default: 'auto'

permissions: {}

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    env:
      SCAN_MODE: ${{ inputs.scan-mode }}
      EVENT_NAME: ${{ github.event_name }}
      PR_COMMITS: ${{ github.event.pull_request.commits }}
      PUSH_COMMIT_IDS: ${{ toJSON(github.event.commits.*.id) }}
    steps:
      - name: Compute scan range
        id: depth
        run: |
          # SCAN_COMMITS = how many of the newest commits to scan; 0 = full
          # history. A pull_request scans its own commits; a push scans the
          # commits in the push payload (GitHub lists at most 20, so 0 or 20+
          # falls back to full history). Any other event, or scan-mode=full,
          # scans everything.
          n=0
          if [ "$SCAN_MODE" != "full" ]; then
            case "$EVENT_NAME" in
              pull_request) n="$PR_COMMITS" ;;
              push) n=$(printf '%s' "$PUSH_COMMIT_IDS" | grep -oE '[0-9a-f]{40}' | wc -l) ;;
            esac
          fi
          n=$((n + 0))
          if [ "$n" -ge 20 ] && [ "$EVENT_NAME" = "push" ]; then n=0; fi
          echo "SCAN_COMMITS=$n" >> "$GITHUB_ENV"
          # One extra commit so the oldest scanned commit has a parent to
          # diff against; fetch-depth 0 = full history.
          if [ "$n" -eq 0 ]; then echo "fetch-depth=0" >> "$GITHUB_OUTPUT"
          else echo "fetch-depth=$((n + 1))" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: ${{ steps.depth.outputs.fetch-depth }}
          # Scan the PR head itself, not the synthetic merge commit.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      - name: Install and run Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /tmp
          if [ "$SCAN_COMMITS" = "0" ]; then
            echo "Scanning full history"
            /tmp/gitleaks detect --source . --redact -v --exit-code 2
          else
            echo "Scanning the newest $SCAN_COMMITS commit(s)"
            /tmp/gitleaks detect --source . --redact -v --exit-code 2 --log-opts="-n $SCAN_COMMITS"
          fi
