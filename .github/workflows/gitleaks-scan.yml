name: Gitleaks Secret Scan

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label (e.g. ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: 'ubuntu-latest'
      scan-mode:
        description: >-
          auto: pull_request and push events scan only the commits they add
          (shallow checkout); every other event (schedule, workflow_dispatch,
          workflow_run, ...) scans full history. full: always scan full history.
        required: false
        type: string
        default: 'auto'

permissions: {}

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    env:
      # Commits to scan; 0 means full history. A PR scans its own commits
      # (github.event.pull_request.commits); a push scans the pushed range
      # (github.event.size). Anything else, or scan-mode=full, scans everything.
      SCAN_COMMITS: >-
        ${{ (inputs.scan-mode != 'full' && github.event_name == 'pull_request' && github.event.pull_request.commits)
        || (inputs.scan-mode != 'full' && github.event_name == 'push' && github.event.size)
        || 0 }}
    steps:
      - name: Compute checkout depth
        id: depth
        run: |
          # One extra commit so the oldest scanned commit has a parent to
          # diff against; 0 = full history.
          if [ "$SCAN_COMMITS" = "0" ]; then echo "fetch-depth=0" >> "$GITHUB_OUTPUT"
          else echo "fetch-depth=$((SCAN_COMMITS + 1))" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: ${{ steps.depth.outputs.fetch-depth }}
          # Scan the PR head itself, not the synthetic merge commit.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      - name: Install and run Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /tmp
          if [ "$SCAN_COMMITS" = "0" ]; then
            echo "Scanning full history"
            /tmp/gitleaks detect --source . --redact -v --exit-code 2
          else
            echo "Scanning the newest $SCAN_COMMITS commit(s)"
            /tmp/gitleaks detect --source . --redact -v --exit-code 2 --log-opts="-n $SCAN_COMMITS"
          fi
